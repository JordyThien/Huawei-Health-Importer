name: HuaweiHealthImporter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  HuaweiHealthImporter:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HuaweiHealthImporter
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HuaweiHealthImporter
        INFOPLIST_FILE: HuaweiHealthImporter/Info.plist
        CODE_SIGN_ENTITLEMENTS: HuaweiHealthImporter/HuaweiHealthImporter.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    entitlements:
      path: HuaweiHealthImporter/HuaweiHealthImporter.entitlements
    capabilities:
      healthKit: {}
    dependencies: []

  HuaweiHealthImporterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HuaweiHealthImporterTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HuaweiHealthImporterTests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    dependencies:
      - target: HuaweiHealthImporter
